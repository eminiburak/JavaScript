<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Border</title>
</head>
<body>
  <h2>Matrix Border Generator</h2>
  <pre id="result"></pre>

  <script>
    function addBorder(picture) {
      const width = picture[0].length + 2;
      const border = "*".repeat(width);

      const bordered = picture.map(row => `*${row}*`);

      return [border, ...bordered, border];
    }

    const picture = ["abc", "ded"];
    const result = addBorder(picture);

    document.getElementById("result").textContent = result.join("\n");
  </script>
</body>
</html>
